database:
  enabled: true
  driver: sqlite
  path: data/polypod.db

ai:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: "${DEEPSEEK_API_KEY}"
  model: deepseek-chat
  max_tokens: 4096
  temperature: 0.3
  tools: true

data:
  dir: data/conversations
  agents_dir: agents

embedding:
  enabled: false
  api_key: ""
  base_url: ""

cli:
  enabled: true

log:
  level: info
  format: text

providers:
  - name: ollama
    base_url: http://localhost:11434/v1
    default: false

mcp: []

sandbox:
  enabled: false
  image: ubuntu:22.04
  memory_limit: 256m
  cpu_limit: "1"
  timeout: 30
  network: true

permissions:
  mode: bypassPermissions
  defaultMode: bypassPermissions
  allow: []
  deny: []
  ask: []

scheduler:
  enabled: false
  data_file: data/scheduler.json

templates:
  dir: templates

hooks: []
