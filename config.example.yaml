database:
  enabled: true
  driver: sqlite
  path: data/polypod.db

ai:
  # Grok pela API: veja examples/grok-api.yaml (XAI_API_KEY).
  # Grok pela conta: grok login + ferramenta grok_delegate; docs/integrations/grok.md.
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: "${DEEPSEEK_API_KEY}"
  model: deepseek-chat
  max_tokens: 4096
  max_tool_iterations: -1 # Unlimited tool rounds; use 1-200 for an explicit cap
  temperature: 0.3
  tools: true

data:
  dir: data/conversations
  agents_dir: agents

embedding:
  enabled: false
  backend: local           # local: FastEmbed multilingual, http: OpenAI-compatible endpoint
  python_binary: ""        # e.g. /home/user/.local/share/polypod/embedding-venv/bin/python
  cache_dir: ""            # directory containing the downloaded model; offline at runtime
  timeout_seconds: 120
  api_key: ""
  base_url: ""
  model: ""

cli:
  enabled: true

log:
  level: info
  format: text

providers:
  - name: ollama
    base_url: http://localhost:11434/v1
    default: false

mcp: []

sandbox:
  enabled: false
  image: ubuntu:22.04
  memory_limit: 256m
  cpu_limit: "1"
  timeout: 30
  network: true

permissions:
  mode: bypassPermissions
  defaultMode: bypassPermissions
  allow: []
  deny: []
  ask: []

scheduler:
  enabled: false
  data_file: data/scheduler.json
  heartbeat_enabled: false
  heartbeat_interval: 1h

# Optional Telegram relay.
remote:
  enabled: false
  bot_token: "${POLYPOD_TELEGRAM_BOT_TOKEN:}"
  chat_id: "${POLYPOD_TELEGRAM_CHAT_ID:}"
  allowed_user_ids: []
  timeout_seconds: 300

# Optional authenticated HTTP trigger. It only listens on loopback; expose it
# through a TLS reverse proxy if a remote system must call it.
webhook:
  enabled: false
  listen: "127.0.0.1:8788"
  token: "${POLYPOD_WEBHOOK_TOKEN:}"

# Native WhatsApp bridge. Keep disabled until PolyClaw's linked-device store has
# been backed up after stopping its gateway and copied to a separate session_dir.
# Use exact WhatsApp JIDs for chats and senders (for example, user@s.whatsapp.net).
# Keep the private session outside the source tree (for example,
# /var/lib/polypod/whatsapp for the root service).
whatsapp:
  enabled: false
  session_dir: "${POLYPOD_WHATSAPP_SESSION_DIR:}"
  # Optional direct chat for the whatsapp_notify skill; must appear in allowed_chats.
  owner_chat: ""
  allowed_chats: []
  allowed_senders: []
  # Local Whisper runs on this machine. Install Python openai-whisper, ffmpeg
  # and a model checkpoint before enabling. See docs/integrations/audio-transcription.md.
  audio_transcription:
    enabled: false
    backend: local
    python_binary: "${POLYPOD_ASR_PYTHON:}"
    script_path: "${POLYPOD_ASR_SCRIPT:}"
    model_path: "${POLYPOD_ASR_MODEL_PATH:}"
    ffmpeg_binary: "${POLYPOD_ASR_FFMPEG:}"
    language: pt
    timeout_seconds: 900
    # Alternative backend: http (OpenAI-compatible /audio/transcriptions).
    # It needs a separate API credential; a ChatGPT or Grok login is not one.
    endpoint: "${POLYPOD_ASR_ENDPOINT:}"
    model: "${POLYPOD_ASR_MODEL:}"
    api_key: "${POLYPOD_ASR_API_KEY:}"
  # Local Piper voice note synthesis for the configured owner_chat.
  voice_output:
    enabled: false
    python_binary: "${POLYPOD_TTS_PYTHON:}"
    model_path: "${POLYPOD_TTS_MODEL_PATH:}"
    ffmpeg_binary: "${POLYPOD_TTS_FFMPEG:ffmpeg}"
    timeout_seconds: 120

templates:
  dir: templates

hooks: []
