name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build all platforms
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          LDFLAGS="-s -w -X github.com/costa/polypod/internal/autoupdate.currentVersion=${VERSION}"
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o polypod-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o polypod-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o polypod-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o polypod-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o polypod-windows-amd64.exe .
          sha256sum polypod-* > checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            polypod-linux-amd64
            polypod-linux-arm64
            polypod-darwin-amd64
            polypod-darwin-arm64
            polypod-windows-amd64.exe
            checksums.txt
