database:
  enabled: false
  driver: sqlite
  path: data/polypod.db

ai:
  provider: deepseek
  base_url: https://api.deepseek.com/v1
  api_key: "${DEEPSEEK_API_KEY}"
  model: deepseek-chat
  max_tokens: 2048
  temperature: 0.3
  tools: true

data:
  dir: data/conversations
  agents_dir: agents

embedding:
  enabled: false

cli:
  enabled: true

log:
  level: debug
  format: text

permissions:
  mode: bypassPermissions
  defaultMode: bypassPermissions

sandbox:
  enabled: false
  network: true
